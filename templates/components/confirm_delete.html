{% with target_id=delete_url|slugify %}
<button type="button"
        class="button button-danger"
        popovertarget="{{ target_id }}"
        aria-label="Hapus {{ item_name }}"
        title="Hapus {{ item_label|lower }}">
    {{ button_label|default:"Hapus" }}
</button>
<div id="{{ target_id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="{{ target_id }}-title">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="{{ target_id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="{{ target_id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="{{ target_id }}-title">Hapus {{ item_label }}?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ item_name }}</strong>?
        </p>
        <form method="post" action="{{ delete_url }}">
            {% csrf_token %}
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="{{ target_id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
{% endwith %}
