{% extends "base.html" %}
{% block meta %}
    <title>{{ name }} - Portofolio</title>
{% endblock meta %}
{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/James.svg" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/James-star7" class="social-link" aria-label="GitHub">
                        <img src="/static/img/icons/github.svg" alt="GitHub">
                    </a>
                    <a href="https://www.linkedin.com/in/james-adi-putra-303393335/" class="social-link" aria-label="LinkedIn">
                        <img src="/static/img/icons/linkedin.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.instagram.com/james_4di?igsh=NGRodGZpNm1vNHh5" class="social-link" aria-label="Instagram">
                        <img src="/static/img/icons/instagram.svg" alt="Instagram">
                    </a>
                    <a href="mailto:j4mes4d1putr4@gmail.com" class="social-link" aria-label="Email">
                        <img src="/static/img/icons/gmail.svg" alt="Email">
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
